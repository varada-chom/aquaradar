<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaRadar TH: แผนที่น้ำ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#eef3f6;--card:#fff;--tx:#14232e;--mu:#586a78;--bd:#cfdae2;--ac:#0a6a8f}
@media (prefers-color-scheme:dark){:root{--bg:#0c151c;--card:#14212b;--tx:#e6eef3;--mu:#93a7b5;--bd:#2a3d4a;--ac:#5cc0e6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 "Noto Sans Thai",system-ui,sans-serif}
.app{display:grid;grid-template-columns:1fr 340px;height:100vh}
#map{height:100%;min-height:320px}
aside{overflow:auto;padding:10px;background:var(--card);border-left:1px solid var(--bd)}
@media (max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}aside{border-left:0}}
h1{font-size:17px;margin:0 0 6px}h3{font-size:14px;margin:12px 0 4px}
.mu{color:var(--mu);font-size:12px}
.bn{border-radius:8px;padding:6px 10px;margin:6px 0;font-size:12px}
.mock{background:#f58f8f;color:#300}.warn{background:#fbe3a1;color:#321}.ok{background:#c4e6d4;color:#042}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
button,select{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:4px 10px;cursor:pointer}
label{display:inline-block;margin-right:10px}
ul{padding-left:18px;margin:4px 0}
</style>
</head>
<body>
<div class="app">
<div id="map" role="application" aria-label="แผนที่สถานีน้ำและฝน"></div>
<aside>
<h1>🌊 AquaRadar TH</h1>
<div id="stat"></div>
<div class="bn warn">ไม่ใช่ประกาศทางการ ให้ยึดประกาศ ปภ. และจังหวัดเสมอ</div>
<h3>ชั้นข้อมูล</h3>
<div><label><input type="checkbox" data-k="wl" checked> ระดับน้ำ</label><label><input type="checkbox" data-k="rain" checked> ฝน 24 ชม.</label><label><input type="checkbox" data-k="ews" checked> EWS</label></div>
<div style="margin-top:6px">แสดงตั้งแต่ระดับ <select id="min"><option value="0">ทั้งหมด</option><option value="1">เฝ้าระวัง+</option><option value="2">เตรียมพร้อม+</option><option value="3">เสี่ยงสูง+</option><option value="4">วิกฤติ</option></select></div>
<div id="leg" class="mu" style="margin-top:6px"></div>
<p class="mu">ซูมออก = สรุปรายจังหวัด · ซูมเข้า (ตั้งแต่ระดับ 8) = รายสถานี</p>
<h3>ใกล้ฉัน</h3>
<button id="loc">ใช้ตำแหน่งของฉัน</button>
<div class="mu">ตำแหน่งถูกประมวลผลในเครื่องคุณเท่านั้น ไม่ส่งไปที่ใด</div>
<div id="near"></div>
<h3>รายละเอียด</h3>
<div id="det" class="mu">แตะจุดบนแผนที่</div>
</aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SEV=['ปกติ','เฝ้าระวัง','เตรียมพร้อม','เสี่ยงสูง','วิกฤติ'];
const COL=['#8aa4b5','#3fae6a','#e6b800','#f07d2a','#d62f2f'];
const KIND={wl:'ระดับน้ำ',rain:'ฝนสะสม 24 ชม.',ews:'สถานีเตือนภัย EWS'};
const STALE_MIN=180;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let D=null,minSev=0,me=null;
const on={wl:true,rain:true,ews:true};
const map=L.map('map',{preferCanvas:true}).setView([13.5,100.9],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map);
$('#leg').innerHTML=SEV.map((s,i)=>'<span class="dot" style="background:'+COL[i]+'"></span>'+s).join(' ');

function describe(s){
  let v='';
  if(s.kind==='wl'){
    if(s.val!=null)v+='ระดับน้ำ '+s.val+' ม.รทก.';
    if(s.bank!=null)v+=(v?' · ':'')+(s.bank>0?'เหนือตลิ่ง '+s.bank+' ม.':'ต่ำกว่าตลิ่ง '+(-s.bank)+' ม.');
  }else if(s.kind==='rain'){v=s.val+' มม./24 ชม.';}
  else if(s.val!=null){v='ค่าล่าสุด '+s.val;}
  const stale=s.age!=null&&s.age>STALE_MIN;
  return '<b>'+esc(s.name)+'</b><br>'+esc(KIND[s.kind])+' · '+esc(SEV[s.sev])+'<br>'+esc(s.prov)+(s.amp?' · '+esc(s.amp):'')
    +(v?'<br>'+esc(v):'')+'<br>'+(s.age==null?'ไม่ทราบเวลาอัปเดต':'อัปเดต '+s.age+' นาทีที่แล้ว')
    +(stale?'<br><b>ข้อมูลเก่า ความมั่นใจลดลง</b>':'');
}
function draw(){
  layer.clearLayers();
  if(!D)return;
  if(map.getZoom()<8){
    D.provinces.forEach(p=>{
      if(p.max<minSev)return;
      L.circleMarker([p.lat,p.lon],{radius:8+Math.min(14,Math.sqrt(p.n)*2),color:'#fff',weight:2,fillColor:COL[p.max],fillOpacity:.85})
        .bindTooltip(esc(p.prov)+' · '+SEV[p.max]).on('click',()=>{
          $('#det').innerHTML='<b>'+esc(p.prov)+'</b><br>สถานีที่เห็น '+p.n+' · สูงสุด: '+esc(SEV[p.max])+'<br>เหนือตลิ่ง '+p.over+' สถานี · ฝนสูงสุด '+p.rain_max+' มม.<br><span class="mu">ศูนย์กลางคำนวณจากพิกัดสถานี ไม่ใช่ขอบเขตจังหวัด</span>';
        }).addTo(layer);
    });
    return;
  }
  const b=map.getBounds().pad(0.2);
  D.signals.forEach(s=>{
    if(!on[s.kind]||s.sev<minSev||!b.contains([s.lat,s.lon]))return;
    const stale=s.age!=null&&s.age>STALE_MIN;
    L.circleMarker([s.lat,s.lon],{radius:4+s.sev*1.5,color:'#fff',weight:1,fillColor:COL[s.sev],fillOpacity:stale?.35:.9})
      .on('click',()=>{$('#det').innerHTML=describe(s);}).addTo(layer);
  });
}
function status(){
  let h='';
  if(D.mock)h+='<div class="bn mock"><b>ข้อมูลตัวอย่าง ไม่ใช่สถานการณ์จริง</b></div>';
  const fileAge=Math.round((Date.now()/1000-D.generated_ts)/60);
  h+='<div class="bn '+(fileAge>90?'warn':'ok')+'">ข้อมูลล่าสุด '+esc(D.generated_at)+' ('+fileAge+' นาทีที่แล้ว)'+(fileAge>90?' — ตัวเก็บข้อมูลอาจหยุดทำงาน':'')+'</div>';
  const names={wl:'ระดับน้ำ',rain:'ฝน',ews:'EWS'};
  h+='<div class="mu">'+Object.keys(D.sources).map(k=>{const m=D.sources[k];return (m.ok?'✓ ':'⚠ ')+names[k]+' '+m.n+(m.ok?'':' (ล้มเหลว)');}).join(' · ')+'</div>';
  $('#stat').innerHTML=h;
}
function hav(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(h));}
function nearby(la,lo){
  const list=D.signals.map(s=>({s:s,d:hav(la,lo,s.lat,s.lon)})).filter(x=>x.d<=25).sort((p,q)=>q.s.sev-p.s.sev||p.d-q.d).slice(0,8);
  $('#near').innerHTML=list.length?'<ul>'+list.map(x=>'<li>'+esc(x.s.name)+' ('+esc(KIND[x.s.kind])+') · '+esc(SEV[x.s.sev])+' · '+x.d.toFixed(1)+' กม.</li>').join('')+'</ul>':'<div class="mu">ไม่พบสถานีในรัศมี 25 กม.</div>';
}
$('#loc').addEventListener('click',()=>{
  if(!D||!navigator.geolocation){$('#near').textContent='เบราว์เซอร์ไม่รองรับหรือข้อมูลยังไม่พร้อม';return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const la=p.coords.latitude,lo=p.coords.longitude;
    if(me)me.remove();
    me=L.marker([la,lo]).addTo(map);
    map.setView([la,lo],11);
    nearby(la,lo);
  },()=>{$('#near').textContent='ไม่สามารถอ่านตำแหน่งได้';});
});
document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('change',()=>{on[el.dataset.k]=el.checked;draw();}));
$('#min').addEventListener('change',e=>{minSev=+e.target.value;draw();});
map.on('zoomend moveend',draw);
fetch('latest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(j=>{
  D=j;status();
  if(D.signals.length)map.fitBounds(L.latLngBounds(D.signals.map(s=>[s.lat,s.lon])).pad(0.1));
  draw();
}).catch(e=>{$('#stat').innerHTML='<div class="bn warn">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'</div>';});
</script>
</body>
</html>
